name: iOS build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    name: Compile check
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-browser-player
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios-browser-player
        run: >
          xcodebuild
          -project StreamBrowser.xcodeproj
          -scheme StreamBrowser
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build

  ipa:
    name: Build signed IPA
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        run: |
          test -n "$APPLE_TEAM_ID" || (echo "Missing APPLE_TEAM_ID" && exit 1)
          test -n "$APPLE_CERTIFICATE_BASE64" || (echo "Missing APPLE_CERTIFICATE_BASE64" && exit 1)
          test -n "$APPLE_CERTIFICATE_PASSWORD" || (echo "Missing APPLE_CERTIFICATE_PASSWORD" && exit 1)
          test -n "$APPLE_PROVISIONING_PROFILE_BASE64" || (echo "Missing APPLE_PROVISIONING_PROFILE_BASE64" && exit 1)
          test -n "$APPLE_KEYCHAIN_PASSWORD" || (echo "Missing APPLE_KEYCHAIN_PASSWORD" && exit 1)

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-browser-player
        run: xcodegen generate

      - name: Import Apple signing certificate
        working-directory: ios-browser-player
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        id: profile
        working-directory: ios-browser-player
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Archive application
        working-directory: ios-browser-player
        run: |
          xcodebuild \
            -project StreamBrowser.xcodeproj \
            -scheme StreamBrowser \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/StreamBrowser.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.profile.outputs.name }}" \
            clean archive

      - name: Prepare export options
        working-directory: ios-browser-player
        run: |
          perl -0pi -e "s/__TEAM_ID__/$ENV{APPLE_TEAM_ID}/g; s/__PROFILE_NAME__/$ENV{PROFILE_NAME}/g" ci/ExportOptions.plist
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.name }}

      - name: Export IPA
        working-directory: ios-browser-player
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/StreamBrowser.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StreamBrowser-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
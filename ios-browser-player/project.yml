name: StreamBrowser
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  bundleIdPrefix: com.example
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  StreamBrowser:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/StreamBrowserApp
    resources:
      - path: Resources/app-config.json
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StreamBrowser
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    scheme:
      gatherCoverageData: false
      testTargets: []
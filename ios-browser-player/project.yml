name: StreamBrowser
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  bundleIdPrefix: com.example
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  ffmpeg-kit:
    url: https://github.com/arthenica/ffmpeg-kit
    exactVersion: 6.0.2
targets:
  StreamBrowser:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/StreamBrowserApp
      - path: Resources/app-config.json
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/LaunchScreen.storyboard
        buildPhase: resources
    dependencies:
      - package: ffmpeg-kit
        product: ffmpeg-kit-ios-https
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StreamBrowser
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
    scheme:
      gatherCoverageData: false
      testTargets: []